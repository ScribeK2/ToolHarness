services:
  harness:
    build: .
    image: toolharness:latest
    ports:
      - "${TOOLHARNESS_PORT:-3000}:80"
    volumes:
      - harness_data:/rails/storage
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      TOOLHARNESS_DEFAULT_USER_EMAIL: ${TOOLHARNESS_DEFAULT_USER_EMAIL:-admin@localhost}
      TOOLHARNESS_DEFAULT_USER_PASSWORD: ${TOOLHARNESS_DEFAULT_USER_PASSWORD:-changeme123}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  harness_data:
