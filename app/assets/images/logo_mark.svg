<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" aria-labelledby="title" role="img">
  <title id="title">ToolHarness</title>
  <desc>ToolHarness mark — transparent background, no tile. A "TH" monogram framed in brackets.</desc>

  <!-- Hard offset shadow -->
  <g transform="translate(18 22)" fill="#16161e">
    <path d="M224 300 H368 V372 H296 V652 H368 V724 H224 Z"/>
    <path d="M800 300 H656 V372 H728 V652 H656 V724 H800 Z"/>
    <path d="M336 352 H504 V424 H448 V672 H392 V424 H336 Z"/>
    <path d="M516 352 H572 V476 H632 V352 H688 V672 H632 V548 H572 V672 H516 Z"/>
  </g>

  <!-- Brackets = the harness/framework -->
  <path d="M224 300 H368 V372 H296 V652 H368 V724 H224 Z"
        fill="#bb9af7" stroke="#16161e" stroke-width="24" stroke-linejoin="round"/>
  <path d="M800 300 H656 V372 H728 V652 H656 V724 H800 Z"
        fill="#bb9af7" stroke="#16161e" stroke-width="24" stroke-linejoin="round"/>

  <!-- T (pink) -->
  <path d="M336 352 H504 V424 H448 V672 H392 V424 H336 Z"
        fill="#f7768e" stroke="#16161e" stroke-width="22" stroke-linejoin="round"/>

  <!-- H (cyan) -->
